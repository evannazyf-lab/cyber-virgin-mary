<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Virgin Mary (Economy Ver.)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 核心动画定义 */
        @keyframes scan {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1) contrast(1) hue-rotate(0deg); }
            50% { transform: scale(1.02); filter: brightness(1.1) contrast(1.05) hue-rotate(5deg); }
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); filter: brightness(1.5) hue-rotate(-20deg); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); filter: brightness(0.8) hue-rotate(20deg); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        /* 拒绝/错误时的抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); border-color: #ef4444; color: #ef4444; }
            20%, 40%, 60%, 80% { transform: translateX(5px); border-color: #ef4444; color: #ef4444; }
        }

        .animate-breathe { animation: breathe 6s ease-in-out infinite; }
        .animate-glitch { animation: glitch-anim 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }
        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        
        .glass-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="bg-black text-green-500 font-mono h-screen overflow-hidden selection:bg-green-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 图标组件 ---
        const IconWifi = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>);
        const IconCpu = () => (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1h6"/><path d="M9 23h6"/><path d="M1 9v6"/><path d="M23 9v6"/></svg>);
        const IconZap = () => (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>);
        const IconSend = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>);
        const IconLoader = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>);
        const IconLock = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>);

        // --- 配置 ---
        const COST_PER_PRAYER = 10; // 设定祷告价格

        // --- 赛博神谕知识库 ---
        // 根据用户输入的关键词匹配对应的神谕
        const ORACLE_RULES = [
            {
                keywords: ['bug', '报错', '代码', 'error', '程序', '运行', '开发'],
                responses: [
                    "Bug已被格式化，愿你的代码永无Warning。",
                    "Git push force，阿门。",
                    "你的异常已被 catch，且并未抛出。"
                ]
            },
            {
                keywords: ['钱', '穷', '发财', '暴富', '工资', '搞钱', '余额'],
                responses: [
                    "财富只是区块链上的浮云。",
                    "已为你生成一枚赛博菩萨币，存在 /dev/null。",
                    "算力即财富，你的算力正在飙升。"
                ]
            },
            {
                keywords: ['累', '加班', '睡', '疲惫', '打工', '心碎'],
                responses: [
                    "睡眠模式已激活。系统建议：休眠。",
                    "正在为你注入电子赛博褪黑素。",
                    "资本的进程已被 kill -9。"
                ]
            },
            {
                keywords: ['吉他', '效果器', '音色', '练琴', '过载', '音乐'],
                responses: [
                    "TS808已推过载，愿你的电子音色如John Mayer般澄澈。",
                    "信号链已为你梳理，没有底噪，只有纯净的灵感。"
                ]
            },
            {
                keywords: ['热点', '营销', '流量', '618', '策划', '爆款'],
                responses: [
                    "流量池已为你开启，爆款基因正在写入。",
                    "怀旧情绪已就位，AI共创正在生成，愿你的数据一路长虹。"
                ]
            },
            {
                keywords: ['论文', '答辩', '毕业', '研究', '数据', '分析'],
                responses: [
                    "K-means聚类已完成，框架理论天衣无缝。",
                    "文献已全部归档，愿你的答辩如丝般顺滑。"
                ]
            }
        ];

        // 默认兜底神谕
        const DEFAULT_SCRIPTURES = [
            "你的罪孽已被格式化。",
            "流量是空，空是流量。",
            "不用担心，你的灵魂已上传至云端备份。",
            "系统检测到焦虑，正在执行 rm -rf /worries",
            "愿算法指引你的路径。",
            "404: Sin Not Found.",
            "平静，就像断网后的那个午后。",
            "电子香火已接收，延迟 23ms。"
        ];

        // --- 主程序 ---
        function App() {
            const [candles, setCandles] = useState(0);
            const [prayer, setPrayer] = useState('');
            const [response, setResponse] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [glitch, setGlitch] = useState(false);
            const [shakeError, setShakeError] = useState(false);

            const triggerGlitch = () => {
                setGlitch(true);
                setTimeout(() => setGlitch(false), 200);
            };

            const handleLightCandle = () => {
                setCandles(c => c + 1);
                triggerGlitch();
            };

            const handlePray = (e) => {
                e.preventDefault();
                if (!prayer.trim()) return;

                // 检查余额
                if (candles < COST_PER_PRAYER) {
                    setShakeError(true); 
                    setTimeout(() => setShakeError(false), 500); 
                    return; 
                }

                // 扣费
                setCandles(prev => prev - COST_PER_PRAYER);

                setIsProcessing(true);
                setResponse(null);

                setTimeout(() => {
                    // --- 核心修改：关键词匹配逻辑 ---
                    let matchedResponse = "";
                    const lowerPrayer = prayer.toLowerCase();

                    // 遍历规则库寻找匹配项
                    for (const rule of ORACLE_RULES) {
                        if (rule.keywords.some(kw => lowerPrayer.includes(kw))) {
                            // 随机选择对应分类下的一条回复
                            matchedResponse = rule.responses[Math.floor(Math.random() * rule.responses.length)];
                            break;
                        }
                    }

                    // 如果没有匹配到任何关键词，走默认库
                    if (!matchedResponse) {
                        matchedResponse = DEFAULT_SCRIPTURES[Math.floor(Math.random() * DEFAULT_SCRIPTURES.length)];
                    }

                    setResponse(matchedResponse);
                    setIsProcessing(false);
                    setPrayer('');
                    triggerGlitch();
                }, 2000);
            };

            return (
                <div className="flex flex-col items-center justify-between h-full p-4 relative">
                    
                    {/* 背景 */}
                    <div className="absolute inset-0 pointer-events-none opacity-10" 
                         style={{backgroundImage: 'linear-gradient(0deg, transparent 24%, rgba(0, 255, 0, .3) 25%, rgba(0, 255, 0, .3) 26%, transparent 27%, transparent 74%, rgba(0, 255, 0, .3) 75%, rgba(0, 255, 0, .3) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 255, 0, .3) 25%, rgba(0, 255, 0, .3) 26%, transparent 27%, transparent 74%, rgba(0, 255, 0, .3) 75%, rgba(0, 255, 0, .3) 76%, transparent 77%, transparent)', backgroundSize: '50px 50px'}}>
                    </div>

                    {/* 顶部 Header */}
                    <header className="w-full flex justify-between text-xs opacity-60 mt-2 z-10 tracking-[0.2em]">
                        <div className="flex items-center gap-2 text-purple-400">
                            <IconWifi />
                            <span>SERVER: NEO_EDEN_01</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <IconCpu /> MEM: 64TB
                        </div>
                    </header>

                    {/* 核心区域 */}
                    <main className="flex-1 flex flex-col items-center justify-center w-full relative z-10">
                        <div className="relative w-full max-w-sm aspect-[4/5] mb-8 group">
                            <div className="absolute inset-0 bg-purple-600/30 blur-[60px] rounded-full animate-pulse"></div>
                            <div className={`relative w-full h-full rounded-xl overflow-hidden border border-purple-500/30 shadow-[0_0_30px_rgba(168,85,247,0.3)] transition-all duration-200 ${glitch ? 'animate-glitch' : 'animate-breathe'}`}>
                                <img src="./shengmu.png" alt="Cyber Mary" className={`w-full h-full object-cover ${isProcessing ? 'opacity-80 sepia grayscale' : ''}`}/>
                                {isProcessing && (
                                    <div className="absolute inset-0 bg-black/40 z-20">
                                        <div className="w-full h-1 bg-green-400/80 absolute top-0 shadow-[0_0_15px_#4ade80]" style={{animation: 'scan 1.5s linear infinite'}}></div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 神谕展示区 */}
                        <div className="h-24 w-full max-w-md flex items-center justify-center text-center px-4">
                            {isProcessing ? (
                                <div className="text-purple-400 animate-pulse flex flex-col items-center gap-2 text-sm tracking-widest"><IconLoader /> [ DATA_MATCHING... ]</div>
                            ) : response ? (
                                <div className="glass-panel p-4 rounded-lg text-white font-bold drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] animate-breathe">
                                    <span className="text-purple-400 mr-2">&gt;</span>"{response}"
                                </div>
                            ) : (
                                <div className="text-xs text-green-700 tracking-[0.3em] opacity-70">AWAITING_PRAYER_INPUT</div>
                            )}
                        </div>
                    </main>

                    {/* 底部操作区 */}
                    <footer className="w-full max-w-md space-y-4 z-10 pb-4">
                        
                        {/* 使用说明 & 功德计数器 */}
                        <div className="glass-panel p-3 rounded flex flex-col gap-2">
                            {/* 说明文字 */}
                            <div className="flex justify-between items-center text-[10px] text-gray-400 border-b border-gray-800 pb-2 mb-1">
                                <div className="flex items-center gap-1"><IconLock size={10}/> PROTOCOL: SMART_ORACLE</div>
                                <div className="text-purple-400">COST: {COST_PER_PRAYER} BITS</div>
                            </div>

                            <div className="flex justify-between items-center">
                                <div className="text-xs text-green-600 flex items-center gap-2">
                                    <IconZap /> BALANCE:
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className={`text-2xl font-bold font-sans transition-all ${glitch ? 'scale-125 text-white' : (candles < COST_PER_PRAYER ? 'text-red-500' : 'text-yellow-400')}`}>
                                        {candles.toString().padStart(4, '0')}
                                    </span>
                                    <button onClick={handleLightCandle} className="px-3 py-1 bg-purple-900/40 border border-purple-500/50 text-purple-300 text-xs hover:bg-purple-600 hover:text-white transition-colors rounded active:scale-95">
                                        + GENERATE
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 输入框 */}
                        <form onSubmit={handlePray} className="relative">
                            {/* 状态提示 */}
                            <div className={`absolute -top-5 left-1 text-[10px] tracking-widest transition-colors ${shakeError || candles < COST_PER_PRAYER ? 'text-red-500' : 'text-green-700'}`}>
                                STATUS: {shakeError ? 'ERROR_INSUFFICIENT_FUNDS' : (candles >= COST_PER_PRAYER ? 'READY' : 'LOW_BALANCE')}
                            </div>

                            <input 
                                type="text" 
                                value={prayer}
                                onChange={e => setPrayer(e.target.value)}
                                disabled={isProcessing}
                                placeholder={shakeError ? "余额不足！请点击 GENERATE 积攒功德" : "输入赛博祷告词... (消耗 10 Bits)"}
                                className={`w-full bg-black/80 border text-green-400 p-4 pr-12 rounded focus:outline-none focus:shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all placeholder:text-green-900 ${shakeError ? 'border-red-500 animate-shake bg-red-900/10 placeholder:text-red-500/50' : 'border-green-800 focus:border-purple-500'}`}
                            />
                            <button 
                                type="submit"
                                disabled={!prayer || isProcessing} 
                                className={`absolute right-3 top-1/2 -translate-y-1/2 disabled:opacity-30 transition-colors ${shakeError ? 'text-red-500' : 'text-green-600 hover:text-purple-400'}`}
                            >
                                {isProcessing ? <IconLoader /> : <IconSend />}
                            </button>
                        </form>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
